<title id="lt">El pulso de TypeScript: todas las versiones menores, de 2012 a 2026</title>
<desc id="ld">Gráfico de puntos. El eje horizontal es el tiempo y el vertical el número de versión menor (.0 a .9). Cada trazo une las versiones menores de una versión mayor. Los datos están en la tabla maestra del capítulo 01.</desc>
